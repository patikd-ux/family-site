apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: family-site-home
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: family-site-helm-clusterip
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: family-site-welcome
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /welcome
            pathType: Prefix
            backend:
              service:
                name: family-site-image
                port:
                  number: 80

