kind: PersistentVolume
apiVersion: v1
metadata:
  name: family-site-pv
spec:
  storageClassName: family-manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/family-site/"
    type: DirectoryOrCreate
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: family-site-pvc
spec:
  storageClassName: family-manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
