apiVersion: v1
kind: Service
metadata:
  name: {{ include "family-site.fullname" . }}-clusterip
  labels:
    {{- include "family-site.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "family-site.selectorLabels" . | nindent 4 }}

